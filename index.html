<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VR Experience</title>
    <script src="https://aframe.io"></script>
</head>
<body>
    <a-scene>
        <!-- Richer Sky and Floor Colors -->
        <a-sky color="#4A90E2"></a-sky> 
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#D2B48C"></a-plane>

        <!-- Pierre (Green Cylinder) -->
        <a-cylinder position="-1.5 1 -3" radius="0.5" height="2" color="#2ECC71"></a-cylinder>

        <!-- Jean (Red Box) -->
        <a-box position="1.5 1 -3" width="1" height="2" depth="1" color="#E74C3C"></a-box>
    </a-scene>
</body>
</html>
